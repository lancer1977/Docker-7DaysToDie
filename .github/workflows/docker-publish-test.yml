name: Release - Test Docker Image CI

# Retargeted off the upstream `vinanrra/7dtd-server` namespace, which this
# fork cannot write to. The inert `branches:` key under `release:` was also
# removed — release events are not branch-filtered.
on:
  release:
    types: [unpublished, prereleased]
  workflow_dispatch:

concurrency:
  group: docker-7daystodie-test-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build and Push Test Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # This workflow ran `scripts/validate.sh` without ever checking the
      # repository out, so it could not have succeeded as written.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate runtime lane
        run: bash scripts/validate.sh

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lancer1977/7dtd-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image digest to the run summary
        run: |
          echo "### Published test image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.docker_build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tag: lancer1977/7dtd-server:test" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
